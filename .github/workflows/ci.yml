name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core-linux:
    name: Engine, Queue, Unit-Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compliance (Lizenzen, Markennamen, Netzwerkcode)
        run: bash tools/compliance/check.sh
      - name: Restore
        run: dotnet restore Kvertis.Core.slnf
      - name: Build
        run: dotnet build Kvertis.Core.slnf --no-restore -c Release
      - name: Test (ohne Integration)
        run: dotnet test Kvertis.Core.slnf --no-build -c Release --filter "Category!=Integration" --collect:"XPlat Code Coverage" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: TestResults

  app-windows:
    name: App (WinUI 3, MSIX) und Integrationstests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Kvertis.sln
      - name: Build (x64)
        run: dotnet build Kvertis.sln --no-restore -c Release -p:Platform=x64
      - name: Test (alle, inkl. Integration wenn ffmpeg vorhanden)
        run: dotnet test Kvertis.sln --no-build -c Release -p:Platform=x64
